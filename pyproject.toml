[project]
name = "pyxa-scverse-demo"
version = "0.1.0"
description = "Read Stellaromics Pyxa output into SpatialData and analyse it with scverse, in marimo notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned: colon_a2_sharding calls spatialdata._io.io_raster._write_raster with shards in storage_options.
    "spatialdata==0.8.0",
    "spatialdata-io",
    "fsspec",
    "huggingface-hub",
    "matplotlib",
    "marimo>=0.25.0",
    "milume>=1.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# pyxa reader (pyxa-reader branch); override with a local path checkout when developing spatialdata-io
spatialdata-io = { git = "https://github.com/ckmah/spatialdata-io", rev = "9a85304fc2f11f04e187f161c399dfb3a7900b3c" }
