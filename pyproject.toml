[project]
name = "pyxa-scverse-demo"
version = "0.1.0"
description = "Read Stellaromics Pyxa output into SpatialData and analyse it with scverse, in marimo notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spatialdata-io",
    "fsspec",
    "huggingface-hub",
    "matplotlib",
    "marimo>=0.25.0",
    "milume>=1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# the pyxa reader is on the pyxa-reader branch, pending upstream review; use a local checkout until it is pushed
spatialdata-io = { path = "../spatialdata-io", editable = true }
